<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="shortcut icon" href="#" />
	<title>eFlip</title>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.1/moment.min.js"
			integrity="sha512-qTXRIMyZIFb8iQcfjXWCO8+M5Tbc38Qi5WzdPOYZHIlZpzBHG3L3by84BBBOiRGiEb7KKtAOAs5qYdUiZiQNNQ=="
			crossorigin="anonymous"
			referrerpolicy="no-referrer"
	></script>
	<style type="text/css">
		html {
			color-scheme: light;
		}
		body {
			background: #fff;
			color: #111;
			font-family: system-ui, sans-serif;
			font-size: 13px;
			margin: 8px;
		}
		.dim {
			color: rgb(150, 150, 150);
		}
		.pending {
			color: red;
		}
		.alwaysShowItem .name {
			text-decoration: line-through;
		}
		#controls {
			display: flex;
			flex-wrap: wrap;
			gap: 8px 14px;
			align-items: center;
			margin-bottom: 6px;
		}
		#controls label {
			white-space: nowrap;
			display: inline-flex;
			align-items: center;
			gap: 4px;
		}
		#controls input[type=checkbox] {
			margin: 0;
		}
		#globalFactor {
			width: 4.5em;
		}
		#progress {
			font-variant-numeric: tabular-nums;
			margin: 4px 0;
		}
		#reportHeader {
			margin: 4px 0;
			min-height: 1.2em;
		}
		table {
			border-collapse: separate;
			border-spacing: 0;
			font-variant-numeric: tabular-nums;
		}
		thead th {
			position: sticky;
			top: 0;
			background: #f2f2f2;
			color: #111;
			border-bottom: 1px solid #bbb;
			padding: 3px 6px;
			cursor: pointer;
			user-select: none;
			white-space: nowrap;
			z-index: 1;
		}
		thead th.sorted {
			background: #e2e8f4;
		}
		td {
			padding: 2px 6px;
			border-bottom: 1px solid #eee;
			white-space: nowrap;
		}
		.numeric {
			text-align: right;
		}
		.text {
			text-align: left;
		}
		td.sel {
			text-align: center;
		}
		tr:hover td {
			background: #f6f9ff;
		}
		tr.filtered td {
			opacity: 0.6;
		}
		td input[type=number] {
			width: 5.5em;
			text-align: right;
			font: inherit;
		}
		td input.factor {
			width: 3em;
		}
		#totals {
			position: sticky;
			top: 0;
			z-index: 2;
			padding: 8px 0;
			margin: 4px 0;
			background: #fff;
			border-top: 1px solid #bbb;
			border-bottom: 1px solid #bbb;
		}
		thead th {
			top: var(--sticky-offset, 0px);
		}
		thead tr.filters th {
			top: calc(var(--sticky-offset, 0px) + var(--head-h, 0px));
			cursor: default;
			padding: 2px 4px;
			font-weight: normal;
		}
		thead tr.filters input {
			width: 3.6em;
			font: inherit;
			font-size: 11px;
			text-align: right;
			margin: 0 1px;
		}
		thead tr.filters a {
			color: rgb(150, 150, 150);
		}
		thead tr.filters span.fval {
			cursor: pointer;
			color: rgb(150, 150, 150);
			padding: 0 2px;
		}
		thead tr.filters span.fval.set {
			color: #111;
			font-weight: bold;
		}
		thead tr.filters span.fval:hover {
			text-decoration: underline;
		}
		#alwaysShowDetails {
			margin: 4px 0;
		}
		#alwaysShowDetails summary {
			cursor: pointer;
		}
		#alwaysShowText {
			width: 100%;
			max-width: 600px;
			height: 120px;
			font: inherit;
			font-size: 12px;
		}
		#alwaysShowNote {
			margin-top: 2px;
		}
	</style>
	<script src="util.js"></script>
	<script src="estimate.js"></script>
	<script src="export.js" defer></script>
</head>
<body>
	<div id="controls">
		<label>From <select id="startStation"></select></label>
		<label>To <select id="endStation"></select></label>
		<button id="run">Run</button>
		<button id="stop" disabled>Stop</button>
		<label><input id="autoRun" type="checkbox" /> auto-run on load</label>
		<label>global factor <input id="globalFactor" type="number" step="0.1" min="0" value="1" /></label>
		<label><input id="showFiltered" type="checkbox" /> show filtered</label>
		<label>search <input id="search" type="search" /></label>
		<button id="copy">Copy orders</button>
	</div>
	<div id="progress" class="dim">idle</div>
	<details id="alwaysShowDetails">
		<summary class="dim">always show (one item name per line)</summary>
		<textarea id="alwaysShowText" spellcheck="false"></textarea>
		<div id="alwaysShowNote" class="dim"></div>
	</details>
	<div id="reportHeader"></div>
	<div id="totals"><span id="sums"></span></div>
	<table id="table">
		<thead><tr id="sortRow"></tr><tr class="filters" id="filterRow"></tr></thead>
		<tbody></tbody>
	</table>
</body>
</html>
