<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="shortcut icon" href="#" />
	<title>eFlip</title>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.1/moment.min.js"
			integrity="sha512-qTXRIMyZIFb8iQcfjXWCO8+M5Tbc38Qi5WzdPOYZHIlZpzBHG3L3by84BBBOiRGiEb7KKtAOAs5qYdUiZiQNNQ=="
			crossorigin="anonymous"
			referrerpolicy="no-referrer"
	></script>
	<style type="text/css">
		html {
			color-scheme: light;
		}
		body {
			background: #fff;
			color: #111;
			font-family: system-ui, sans-serif;
			font-size: 13px;
			margin: 8px;
		}
		.dim {
			color: rgb(150, 150, 150);
		}
		.pending {
			color: red;
		}
		.alwaysShowItem .name {
			text-decoration: line-through;
		}
		#controls {
			display: flex;
			flex-wrap: wrap;
			gap: 8px 14px;
			align-items: center;
			margin-bottom: 6px;
		}
		#controls label {
			white-space: nowrap;
		}
		#globalFactor {
			width: 4.5em;
		}
		#progress {
			font-variant-numeric: tabular-nums;
			margin: 4px 0;
		}
		#reportHeader {
			margin: 4px 0;
			min-height: 1.2em;
		}
		table {
			border-collapse: separate;
			border-spacing: 0;
			font-variant-numeric: tabular-nums;
		}
		thead th {
			position: sticky;
			top: 0;
			background: #f2f2f2;
			color: #111;
			border-bottom: 1px solid #bbb;
			padding: 3px 6px;
			cursor: pointer;
			user-select: none;
			white-space: nowrap;
			z-index: 1;
		}
		thead th.sorted {
			background: #e2e8f4;
		}
		td {
			padding: 2px 6px;
			border-bottom: 1px solid #eee;
			white-space: nowrap;
		}
		.numeric {
			text-align: right;
		}
		.text {
			text-align: left;
		}
		td.sel {
			text-align: center;
		}
		tr:hover td {
			background: #f6f9ff;
		}
		tr.filtered td {
			opacity: 0.6;
		}
		td input[type=number] {
			width: 5.5em;
			text-align: right;
			font: inherit;
		}
		td input.factor {
			width: 4.5em;
		}
		#footer {
			position: sticky;
			bottom: 0;
			display: flex;
			justify-content: space-between;
			gap: 12px;
			padding: 6px 0;
			background: #fff;
			border-top: 1px solid #bbb;
			margin-top: 4px;
		}
	</style>
	<script src="util.js"></script>
	<script src="estimate.js"></script>
	<script src="export.js" defer></script>
</head>
<body>
	<div id="controls">
		<label>From <select id="startStation"></select></label>
		<label>To <select id="endStation"></select></label>
		<button id="run">Run</button>
		<button id="stop" disabled>Stop</button>
		<label><input id="autoRun" type="checkbox" /> auto-run on load</label>
		<label>global factor <input id="globalFactor" type="number" step="0.1" min="0" value="1" /></label>
		<label><input id="showFiltered" type="checkbox" /> show filtered</label>
		<button id="copy">Copy orders</button>
	</div>
	<div id="progress" class="dim">idle</div>
	<div id="reportHeader"></div>
	<table id="table">
		<thead></thead>
		<tbody></tbody>
	</table>
	<div id="footer">
		<div id="sums"></div>
	</div>
</body>
</html>
